# Stereo I-JEPA - Cross-View Naive Experiment
# FlyingThings3D Dataset
# Single GPU Training

data:
  batch_size: 16
  color_jitter_strength: 0.0
  crop_scale:
    - 0.3
    - 1.0
  crop_size: 448 # Larger to preserve FlyingThings3D detail (960x540 native)
  image_folder: null # Not used for FlyingThings3D
  num_workers: 4 # Adjust based on your CPU cores
  pin_mem: true
  root_path: /path/to/FlyingThings3D # ⚠️ CHANGE THIS to your FlyingThings3D root directory
  use_color_distortion: false # Keep simple for stereo
  use_gaussian_blur: false
  use_horizontal_flip: false # ⚠️ Don't flip stereo pairs!

logging:
  folder: ./logs/stereo_naive_ft3d # ⚠️ CHANGE THIS to your desired log directory
  write_tag: stereo_jepa

mask:
  allow_overlap: false # Context and target blocks don't overlap
  aspect_ratio:
    - 0.75
    - 1.5
  enc_mask_scale:
    - 0.4 # Context blocks: 40-80% of image
    - 0.8
  min_keep: 10
  num_enc_masks: 1 # One context block
  num_pred_masks: 4 # Four target blocks to predict
  patch_size: 16 # 448/16 = 28x28 patches (vs 224/16 = 14x14)
  pred_mask_scale:
    - 0.15 # Target blocks: 15-20% of image
    - 0.2

meta:
  copy_data: false
  load_checkpoint: false
  model_name: vit_base # Start with base, can scale up later
  pred_depth: 6 # Predictor depth
  pred_emb_dim: 192 # Predictor embedding dimension
  read_checkpoint: null
  use_bfloat16: false # Set true if you have Ampere+ GPU (RTX 30XX/40XX, A100)

optimization:
  ema:
    - 0.996 # EMA momentum start
    - 1.0 # EMA momentum end
  epochs: 50 # Start with 50 epochs for initial experiment
  final_lr: 1.0e-06
  final_weight_decay: 0.4
  ipe_scale: 1.0
  lr: 0.0005 # Lower learning rate for smaller batch size
  start_lr: 0.0001
  warmup: 10 # 10 epochs warmup
  weight_decay: 0.04
